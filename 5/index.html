<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尚武协会2025春季招新</title>
    <style>
        /* 全局重置与基础样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #111; /* 深邃黑底 */
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 主海报卡片样式 */
        .poster-card {
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid #d4af37; /* 金色边框 */
            border-radius: 8px;
            padding: 50px 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            position: relative;
        }

        /* 顶部印章装饰 */
        .seal {
            display: inline-block;
            border: 2px solid #c00;
            color: #c00;
            padding: 5px 10px;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* 标题样式 */
        h1 {
            font-size: 48px;
            color: #d4af37; /* 金色 */
            margin-bottom: 10px;
            font-family: "KaiTi", "STKaiti", serif; /* 优先使用楷体 */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }

        /* 核心亮点列表 */
        .features {
            display: flex;
            justify-content: space-around;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .feature-item {
            flex: 1;
            min-width: 120px;
            margin: 10px;
        }

        .feature-item h3 {
            color: #d4af37;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .feature-item p {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
        }

        /* 底部行动号召 */
        .cta-area {
            border-top: 1px dashed #444;
            padding-top: 30px;
        }

        .cta-area p {
            font-size: 16px;
            margin-bottom: 15px;
            color: #fff;
        }

        .qr-placeholder {
            width: 120px;
            height: 120px;
            background: #fff;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 12px;
            font-weight: bold;
        }

        .hint {
            font-size: 12px;
            color: #888;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            h1 { font-size: 36px; }
            .poster-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="poster-card">
    <div class="seal">以武会友</div>
    <h1>尚武协会</h1>
    <div class="subtitle">2025 春季招新 · 野蛮体魄 文明精神</div>

    <div class="features">
        <div class="feature-item">
            <h3>🥋 传统武术</h3>
            <p>  感受国粹底蕴  </p>
        </div>
        <div class="feature-item">
            <h3>🥊 实战搏击</h3>
            <p>散打 / 防身术<br>释放热血青春</p>
        </div>
        <div class="feature-item">
            <h3>🤝 交流团建</h3>
            <p>校内切磋 / 户外拉练<br>结识硬核伙伴</p>
        </div>
    </div>

    <div class="cta-area">
        <p>零基础友好！学长学姐手把手教学</p>
        <div class="qr-placeholder">[ 替换为招新群二维码 ]</div>
        <p class="hint">扫码加入招新咨询群，获取最新面试通知</p>
    </div>
<p>此网址后面将做为社团官网</p>
</div>

</body>
</html>
