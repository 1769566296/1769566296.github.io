<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尚武协会2026秋季招新</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #111;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100dvh; /* 适配移动端动态视口高度 */
            overflow-y: auto; /* 改为允许纵向滚动，内容超出时自动出现滚动条 */
            padding: 20px 0; /* 上下留白，避免贴边 */
        }

        .poster-card {
            background: rgba(30, 30, 30, 0.9);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 50px 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            /* 确保卡片不会超出视口，内容可滚动 */
            max-height: 95dvh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .seal {
            display: inline-block;
            border: 2px solid #c00;
            color: #c00;
            padding: 5px 10px;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        h1 {
            font-size: 48px;
            color: #d4af37;
            margin-bottom: 10px;
            font-family: "KaiTi", "STKaiti", serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }

        .features {
            display: flex;
            justify-content: space-around;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .feature-item {
            flex: 1;
            min-width: 120px;
            margin: 10px;
        }

        .feature-item h3 {
            color: #d4af37;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .feature-item p {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
        }

        .cta-area {
            border-top: 1px dashed #444;
            padding-top: 30px;
        }

        .cta-area p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #fff;
        }

        /* 跳转按钮样式 */
        .join-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(45deg, #d4af37, #b8860b);
            color: #111;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .join-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }

        @media (max-width: 480px) {
            h1 { font-size: 36px; }
            .poster-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="poster-card">
    <div class="seal">以武会友</div>
    <h1>尚武协会</h1>
    <div class="subtitle">2026 秋季招新 · 聚是一团火，散是满天星</div>

    <div class="features">
        <div class="feature-item">
            <h3>传统武术</h3>
            <p>太极 / 长拳 / 器械<br>感受国粹底蕴</p>
        </div>
        <div class="feature-item">
            <h3>实战搏击</h3>
            <p>散打 / 防身术<br>释放热血青春</p>
        </div>
        <div class="feature-item">
            <h3>交流团建</h3>
            <p>校内切磋 / 户外拉练<br>结识硬核伙伴</p>
        </div>
    </div>

    <div class="cta-area">
        <p>零基础友好！学长学姐手把手教学</p>
        
        <a href="https://qun.qq.com/universal-share/share?ac=1&authKey=jlZMK3PiKDR7f5aaR63el%2FyqqoaJJNZJqDZm8o0nGhoOjWCHH5qXILVRvANg8iYG&busi_data=eyJncm91cENvZGUiOiIxMTIxMTAzOTg2IiwidG9rZW4iOiIzd0RKcjlNQjd3WE45dDJ0NlZJWW9jUVNQVTlZQXVjK1BabU9sMGNHZlFndmkxR2Q4aG1JUXRvd2lvOGt3UkVVIiwidWluIjoiMTc2OTU2NjI5NiJ9&data=VvzLCbAIUC-jmSytnLJTXB6YNAcSIGCQrs8xkgG6xYS8r2GiNZIY1p9QuwuSsSN_mjkapWFSs0L3oJUeivIJ6A&svctype=4&tempid=h5_group_info" class="join-btn">加入我们！</a>
        
        <p class="hint">点击按钮加入我们！</p>
    </div>
</div>

</body>
</html>
